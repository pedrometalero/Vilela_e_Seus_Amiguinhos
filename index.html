<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lord of Metal! - Flashcard</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Lord of Metal!</h1>
    </header>

    <main>
      <h2>Passe o mouse no cartão para ver o verso</h2>

      <!-- Container do Flashcard -->
      <div class="flashcard">
        <div class="flashcard-inner">
          <!-- FRENTE DO CARTÃO -->
          <div class="flashcard-front">
            <img
              src="https://gstatic.com"
              alt="Logo ou imagem da frente"
              class="flashcard-img"
            />
            <h3>Dica</h3>
            <p>Agressividade e velocidade são o que definem esta banda!</p>
          </div>

          <!-- VERSO DO CARTÃO -->
          <div class="flashcard-back">
            <img
              src="https://abril.com.br"
              alt="Integrantes da banda Slayer"
              class="flashcard-img"
            />
            <h3>Resposta</h3>
            <p><strong>SLAYER!</strong></p>
          </div>
        </div>
      </div>
    </main>

    <footer>
      <p>Projeto feito por Pedro Vilela.</p>
    </footer>
  </body>
</html>
